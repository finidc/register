name: Deploy FINIDC Registration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "schema.sql"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/deploy-production-test"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: finidc-register-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker and D1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run check

      - name: Find or create D1 database
        id: database
        shell: bash
        run: |
          response_file="$(mktemp)"
          curl --fail-with-body --silent --show-error \
            --output "$response_file" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=finidc-register-db"

          database_id="$(jq -r '.result[0].uuid // empty' "$response_file")"

          if [[ -z "$database_id" ]]; then
            curl --fail-with-body --silent --show-error \
              --output "$response_file" \
              --request POST \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data '{"name":"finidc-register-db"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
            database_id="$(jq -r '.result.uuid // empty' "$response_file")"
          fi

          if [[ -z "$database_id" ]]; then
            echo "::error::Could not find or create the D1 database."
            jq -r '.errors[]?.message // empty' "$response_file"
            exit 1
          fi

          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
          echo "D1 database is ready."

      - name: Create deployment configuration
        shell: bash
        env:
          DATABASE_ID: ${{ steps.database.outputs.database_id }}
        run: |
          jq -n \
            --arg database_id "$DATABASE_ID" \
            '{
              "$schema": "node_modules/wrangler/config-schema.json",
              "name": "finidc-register",
              "main": "src/worker.js",
              "compatibility_date": "2026-07-24",
              "assets": {
                "directory": "./public",
                "binding": "ASSETS",
                "run_worker_first": true
              },
              "d1_databases": [{
                "binding": "DB",
                "database_name": "finidc-register-db",
                "database_id": $database_id
              }]
            }' > wrangler.generated.json

      - name: Apply database schema
        run: npx wrangler d1 execute finidc-register-db --remote --file=./schema.sql --config=./wrangler.generated.json

      - name: Deploy to Cloudflare
        run: npx wrangler deploy --config=./wrangler.generated.json
