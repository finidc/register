name: Deploy FINIDC Registration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "schema.sql"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/deploy-production-test"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: finidc-register-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker and D1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FINIDC_ADMIN_EMAIL: ${{ secrets.FINIDC_ADMIN_EMAIL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run check

      - name: Find or create D1 database
        id: database
        shell: bash
        run: |
          response_file="$(mktemp)"
          curl --fail-with-body --silent --show-error \
            --output "$response_file" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=finidc-register-db"

          database_id="$(jq -r '.result[0].uuid // empty' "$response_file")"

          if [[ -z "$database_id" ]]; then
            curl --fail-with-body --silent --show-error \
              --output "$response_file" \
              --request POST \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data '{"name":"finidc-register-db"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
            database_id="$(jq -r '.result.uuid // empty' "$response_file")"
          fi

          if [[ -z "$database_id" ]]; then
            echo "::error::Could not find or create the D1 database."
            jq -r '.errors[]?.message // empty' "$response_file"
            exit 1
          fi

          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
          echo "D1 database is ready."

      - name: Create deployment configurations
        shell: bash
        env:
          DATABASE_ID: ${{ steps.database.outputs.database_id }}
        run: |
          admin_email="${FINIDC_ADMIN_EMAIL:-__disabled__}"
          create_config() {
            worker_name="$1"
            admin_host="$2"
            output_file="$3"

            jq -n \
            --arg database_id "$DATABASE_ID" \
            --arg admin_email "$admin_email" \
            --arg worker_name "$worker_name" \
            --arg admin_host "$admin_host" \
            '{
              "$schema": "node_modules/wrangler/config-schema.json",
              "name": $worker_name,
              "main": "src/worker.js",
              "compatibility_date": "2026-07-24",
              "assets": {
                "directory": "./public",
                "binding": "ASSETS",
                "run_worker_first": true
              },
              "vars": {
                "ADMIN_HOST": $admin_host,
                "ADMIN_EMAIL": $admin_email
              },
              "d1_databases": [{
                "binding": "DB",
                "database_name": "finidc-register-db",
                "database_id": $database_id
              }]
            }' > "$output_file"
          }

          create_config \
            "finidc-register" \
            "finidc-register-admin.ngo358fin.workers.dev" \
            "wrangler.public.generated.json"

          create_config \
            "finidc-register-admin" \
            "finidc-register-admin.ngo358fin.workers.dev" \
            "wrangler.admin.generated.json"

      - name: Apply database schema
        run: npx wrangler d1 execute finidc-register-db --remote --file=./schema.sql --config=./wrangler.public.generated.json

      - name: Deploy public registration Worker
        run: npx wrangler deploy --config=./wrangler.public.generated.json

      - name: Deploy protected admin Worker
        run: npx wrangler deploy --config=./wrangler.admin.generated.json

      - name: Test live registration and clean test record
        shell: bash
        run: |
          base_url="https://finidc-register.ngo358fin.workers.dev"

          health="$(curl --fail-with-body --silent --show-error --retry 5 --retry-delay 2 "$base_url/api/health")"
          if [[ "$(jq -r '.ok' <<< "$health")" != "true" ]]; then
            echo "::error::The deployed health check failed."
            exit 1
          fi

          result="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"name":"FINIDC Deployment Test","email":"deployment-test@finidc.invalid","phone":"","profession":"it","professionOther":"","city":"Espoo","language":"English","interests":["community-meetings"],"website":"","consent":true}' \
            "$base_url/api/register")"

          if [[ "$(jq -r '.ok' <<< "$result")" != "true" ]]; then
            echo "::error::The deployed registration test failed."
            exit 1
          fi

          npx wrangler d1 execute finidc-register-db \
            --remote \
            --command="DELETE FROM registrations WHERE email = 'deployment-test@finidc.invalid';" \
            --config=./wrangler.public.generated.json

          echo "Live health check, registration write, and cleanup succeeded."

      - name: Test admin Worker boundary
        shell: bash
        run: |
          admin_url="https://finidc-register-admin.ngo358fin.workers.dev"

          health_file="$(mktemp)"
          health_status="$(curl --silent --show-error --retry 5 --retry-delay 2 \
            --output "$health_file" --write-out '%{http_code}' "$admin_url/api/health")"
          if [[ "$health_status" == "200" ]]; then
            if [[ "$(jq -r '.ok' "$health_file")" != "true" ]]; then
              echo "::error::The admin Worker health check failed."
              exit 1
            fi
          elif [[ "$health_status" != "302" ]]; then
            echo "::error::The admin Worker health check returned HTTP $health_status."
            exit 1
          fi

          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$admin_url/api/admin/session")"
          if [[ "$status" != "403" && "$status" != "302" ]]; then
            echo "::error::The admin boundary returned unexpected HTTP status $status."
            exit 1
          fi

          echo "Admin Worker is online and rejects unauthenticated API access."
