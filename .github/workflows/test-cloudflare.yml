name: Test Cloudflare Connection

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test-cloudflare.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/cloudflare-connection-test

permissions:
  contents: read

jobs:
  test-cloudflare:
    name: Verify Cloudflare API access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check required secrets
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing."
            exit 1
          fi
          echo "Required GitHub secrets are available."

      - name: Verify API token
        shell: bash
        run: |
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header "Content-Type: application/json" "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          if [[ "$http_code" != "200" ]] || [[ "$(jq -r '.success' "$response_file")" != "true" ]]; then
            message="$(jq -r '.errors[0].message // "Unknown Cloudflare API error"' "$response_file")"
            echo "::error::Cloudflare token verification failed (HTTP $http_code): $message"
            exit 1
          fi
          status="$(jq -r '.result.status // "unknown"' "$response_file")"
          echo "Cloudflare API token is valid. Status: $status"

      - name: Verify account access
        shell: bash
        run: |
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header "Content-Type: application/json" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")"
          if [[ "$http_code" != "200" ]] || [[ "$(jq -r '.success' "$response_file")" != "true" ]]; then
            message="$(jq -r '.errors[0].message // "Unknown Cloudflare API error"' "$response_file")"
            echo "::error::Cloudflare account access failed (HTTP $http_code): $message"
            exit 1
          fi
          account_name="$(jq -r '.result.name // "accessible account"' "$response_file")"
          echo "GitHub Actions successfully connected to Cloudflare account: $account_name"
